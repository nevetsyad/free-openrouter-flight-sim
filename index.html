<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free OpenRouter Flight Sim</title>
<!-- flightsim-build:2026-09-29-v4 -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
  canvas { display: block; }
  #hud {
    position: absolute; top: 10px; left: 10px; color: #0f0;
    background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 5px;
    font-size: 13px; line-height: 1.6; pointer-events: none; z-index: 2;
  }
  #controls {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: #aaa; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 5px;
    font-size: 11px; pointer-events: none; white-space: nowrap; z-index: 2;
  }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55); z-index: 5; cursor: pointer;
  }
  #overlay .card {
    color: #0f0; background: rgba(0,0,0,0.92); padding: 30px 40px; border-radius: 8px;
    text-align: center; max-width: 520px;
  }
  #overlay h1 { font-size: 24px; margin-bottom: 10px; color: #fff; }
  #overlay p { font-size: 13px; margin: 5px 0; }
  #overlay .start { color: #ff0; font-size: 16px; margin-top: 15px; }
  #overlay.error .start { color: #f66; animation: none; }
</style>
</head>
<body>
<div id="hud">
  <div>ALT: <span id="alt">0</span> ft</div>
  <div>SPD: <span id="spd">0</span> kts</div>
  <div>VS: <span id="vs">0</span> fpm</div>
  <div>PITCH: <span id="pitch">0</span>°</div>
  <div>ROLL: <span id="roll">0</span>°</div>
  <div>HDG: <span id="hdg">0</span>°</div>
  <div>THR: <span id="thr">0</span>%</div>
  <div>GEAR: <span id="gear">DOWN</span></div>
</div>
<div id="controls">↑/↓ Pitch · ←/→ Roll · W/S Throttle · G Gear · C Camera · Space Reset</div>
<div id="overlay">
  <div class="card">
    <h1>✈ FREE OPENROUTER FLIGHT SIM</h1>
    <p>Loading aircraft…</p>
    <p class="start" id="start-msg">Please wait</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const BUILD = '2026-09-29-v4';
const TERRAIN_SIZE = 8000;
const TERRAIN_SEG = 160;

let camera, scene, renderer, clock;
let plane;
let velocity = new THREE.Vector3();
let throttle = 0.62;
let airspeed = 52;
let pitch = 0.04, roll = 0, yaw = 0;
let gearDown = true;
let cameraMode = 0;
let keys = {};
let started = false;
let ready = false;
let terrainMesh;

const overlay = document.getElementById('overlay');
const startMsg = document.getElementById('start-msg');

function showError(err) {
  overlay.classList.add('error');
  overlay.querySelector('p').textContent = 'The simulator failed to start.';
  startMsg.textContent = String(err && err.message ? err.message : err);
  console.error(err);
}

function hideOverlay() {
  overlay.style.display = 'none';
}

function tryStart() {
  if (!ready || started) return;
  started = true;
  hideOverlay();
}

function terrainHeightAt(x, z) {
  let h = 0;
  h += Math.sin(x * 0.004) * Math.cos(z * 0.004) * 90;
  h += Math.sin(x * 0.011 + 1.3) * Math.cos(z * 0.009) * 28;
  h += Math.sin(x * 0.03 + 2.1) * Math.cos(z * 0.027) * 6;
  return Math.max(0, h);
}

function createTerrain() {
  const geo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const color = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const h = terrainHeightAt(x, z);
    pos.setY(i, h);
    if (h < 2) color.setHex(0x2a5533);
    else if (h < 25) color.setHex(0x3a7544);
    else if (h < 60) color.setHex(0x6a7050);
    else color.setHex(0x9aa0a8);
    colors[i * 3] = color.r;
    colors[i * 3 + 1] = color.g;
    colors[i * 3 + 2] = color.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  terrainMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true }));
  scene.add(terrainMesh);
}

function createAircraft() {
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshPhongMaterial({ color: 0xd8dde6 });
  const dark = new THREE.MeshPhongMaterial({ color: 0x333333 });

  const fuselageGeo = new THREE.CylinderGeometry(0.35, 0.22, 4.2, 8);
  fuselageGeo.rotateX(Math.PI / 2);
  group.add(new THREE.Mesh(fuselageGeo, bodyMat));

  const wing = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.08, 1.15), bodyMat);
  wing.position.set(0, 0.05, 0.2);
  group.add(wing);

  const tail = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.06, 0.7), bodyMat);
  tail.position.set(0, 0.15, 1.7);
  group.add(tail);

  const fin = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.9, 0.7), bodyMat);
  fin.position.set(0, 0.55, 1.7);
  group.add(fin);

  const engGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.7, 8);
  engGeo.rotateX(Math.PI / 2);
  const engL = new THREE.Mesh(engGeo, dark);
  engL.position.set(-1.3, -0.15, 0.3);
  const engR = engL.clone();
  engR.position.x = 1.3;
  group.add(engL, engR);

  const cockpit = new THREE.Mesh(
    new THREE.BoxGeometry(0.7, 0.42, 1.1),
    new THREE.MeshPhongMaterial({ color: 0x88ccff, transparent: true, opacity: 0.55 })
  );
  cockpit.position.set(0, 0.32, -0.35);
  group.add(cockpit);

  // Retractable tricycle landing gear.
  const gearMeshes = [];
  const strutMat = new THREE.MeshPhongMaterial({ color: 0x777777 });
  const wheelMat = new THREE.MeshPhongMaterial({ color: 0x151515 });
  const addGear = (x, z, length) => {
    const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, length, 8), strutMat);
    strut.position.set(x, -length / 2, z);
    strut.rotation.z = Math.PI / 2;
    group.add(strut);
    const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.055, 8, 16), wheelMat);
    wheel.position.set(x, -length - 0.04, z);
    wheel.rotation.y = Math.PI / 2;
    group.add(wheel);
    gearMeshes.push(strut, wheel);
  };
  addGear(0, -0.45, 0.55);
  addGear(-1.25, 0.55, 0.72);
  addGear(1.25, 0.55, 0.72);
  group.userData.gearMeshes = gearMeshes;

  group.position.set(0, 220, 0);
  scene.add(group);
  return group;
}

function applyAttitude() {
  plane.rotation.order = 'YXZ';
  // Three.js +X rotation pitches the nose down, so nose-up pitch is negated.
  plane.rotation.set(-pitch, yaw, roll);
}

function forwardVector() {
  return new THREE.Vector3(0, 0, -1).applyQuaternion(plane.quaternion);
}

function updateCamera() {
  if (cameraMode === 0) {
    const dir = new THREE.Vector3(0, 2.2, 11).applyQuaternion(plane.quaternion);
    camera.position.lerp(plane.position.clone().add(dir), 0.12);
    camera.lookAt(plane.position);
  } else {
    const offset = new THREE.Vector3(0, 0.45, -0.15).applyQuaternion(plane.quaternion);
    camera.position.copy(plane.position).add(offset);
    camera.quaternion.copy(plane.quaternion);
  }
}

function setGear(down) {
  gearDown = down;
  if (plane?.userData.gearMeshes) {
    plane.userData.gearMeshes.forEach(mesh => { mesh.visible = gearDown; });
  }
  const gearEl = document.getElementById('gear');
  if (gearEl) gearEl.textContent = gearDown ? 'DOWN' : 'UP';
}

function resetFlight() {
  plane.position.set(0, 220, 0);
  pitch = 0.04;
  roll = 0;
  yaw = 0;
  throttle = 0.62;
  airspeed = 52;
  setGear(true);
  applyAttitude();
  velocity.copy(forwardVector().multiplyScalar(airspeed));
  cameraMode = 0;
}

function updatePhysics(dt) {
  const pitchRate = 0.7;
  const rollRate = 1.1;
  if (keys['arrowup']) pitch += pitchRate * dt;
  if (keys['arrowdown']) pitch -= pitchRate * dt;
  // Reversed roll mapping: left rolls left, right rolls right.
  if (keys['arrowleft']) roll += rollRate * dt;
  if (keys['arrowright']) roll -= rollRate * dt;
  if (!keys['arrowleft'] && !keys['arrowright']) roll *= Math.exp(-dt * 0.6);

  pitch = Math.max(-0.7, Math.min(0.6, pitch));
  roll = Math.max(-1.2, Math.min(1.2, roll));
  yaw -= Math.sin(roll) * dt * 0.55;
  applyAttitude();

  if (keys['w']) throttle = Math.min(1, throttle + dt * 0.28);
  if (keys['s']) throttle = Math.max(0, throttle - dt * 0.28);
  if (keys['g']) {
    setGear(!gearDown);
    keys['g'] = false;
  }

  const targetSpeed = 18 + throttle * 62;
  const gearDrag = gearDown ? 0.88 : 1;
  airspeed *= Math.pow(gearDrag, dt);
  const stalling = airspeed < 26 && pitch > 0.25;
  airspeed += (targetSpeed - airspeed) * Math.min(1, dt * (stalling ? 0.35 : 0.8));
  if (pitch > 0.15) airspeed -= pitch * dt * 6;
  if (pitch < -0.05) airspeed += -pitch * dt * 4;
  airspeed = Math.max(0, airspeed);

  const forward = forwardVector();
  const desired = forward.clone().multiplyScalar(airspeed);
  if (stalling) desired.y -= 18;
  else if (airspeed < 32) desired.y -= (32 - airspeed) * 0.35;

  velocity.lerp(desired, 1 - Math.exp(-dt * 2.4));
  plane.position.add(velocity.clone().multiplyScalar(dt));

  const groundClearance = gearDown ? 2.15 : 0.85;
  const ground = terrainHeightAt(plane.position.x, plane.position.z) + groundClearance;
  if (plane.position.y <= ground) {
    plane.position.y = ground;
    // Gear-down landings settle onto the runway/terrain instead of bouncing.
    // A belly landing is also survivable, but bleeds speed more aggressively.
    if (velocity.y < 0) velocity.y = 0;
    airspeed *= Math.pow(gearDown ? 0.985 : 0.94, dt * 60);
    pitch = Math.max(pitch, 0.02);
    if (airspeed < (gearDown ? 22 : 12)) {
      velocity.multiplyScalar(0.96);
      airspeed *= 0.96;
    }
  }

  if (keys[' ']) {
    resetFlight();
    keys[' '] = false;
  }
  if (keys['c']) {
    cameraMode = 1 - cameraMode;
    keys['c'] = false;
  }

  const mToFt = 3.28084;
  const mpsToKt = 1.94384;
  document.getElementById('alt').textContent = Math.round(Math.max(0, plane.position.y) * mToFt);
  document.getElementById('spd').textContent = Math.round(airspeed * mpsToKt);
  document.getElementById('vs').textContent = Math.round(velocity.y * mToFt * 60);
  document.getElementById('pitch').textContent = (pitch * 180 / Math.PI).toFixed(1);
  document.getElementById('roll').textContent = (roll * 180 / Math.PI).toFixed(1);
  let hdg = (-yaw * 180 / Math.PI) % 360;
  if (hdg < 0) hdg += 360;
  document.getElementById('hdg').textContent = hdg.toFixed(0);
  document.getElementById('thr').textContent = Math.round(throttle * 100);
  document.getElementById('gear').textContent = gearDown ? 'DOWN' : 'UP';
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (started) updatePhysics(dt);
  updateCamera();
  renderer.render(scene, camera);
}

function init() {
  clock = new THREE.Clock();
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x87b4dc, 0.00022);
  scene.background = new THREE.Color(0x87b4dc);

  const skyGeo = new THREE.SphereGeometry(12000, 24, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      topColor: { value: new THREE.Color(0x1d4f9c) },
      bottomColor: { value: new THREE.Color(0xb7ddff) }
    },
    vertexShader: `varying vec3 vWorldPos; void main() { vWorldPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 topColor; uniform vec3 bottomColor; varying vec3 vWorldPos; void main() { float h = normalize(vWorldPos).y * 0.5 + 0.5; gl_FragColor = vec4(mix(bottomColor, topColor, pow(h, 0.8)), 1.0); }`
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  const sun = new THREE.DirectionalLight(0xffffff, 1.35);
  sun.position.set(400, 800, 200);
  scene.add(sun);
  scene.add(new THREE.HemisphereLight(0x9ecbff, 0x3d5a32, 0.55));

  createTerrain();
  plane = createAircraft();
  setGear(true);
  applyAttitude();
  velocity.copy(forwardVector().multiplyScalar(airspeed));

  camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.2, 20000);
  updateCamera();

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
    tryStart();
  });
  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('pointerdown', tryStart);
  overlay.addEventListener('pointerdown', (e) => { e.preventDefault(); tryStart(); });

  ready = true;
  overlay.querySelector('p').textContent = 'Nose follows the stick. Pull up to climb.';
  startMsg.textContent = 'Click or press any key to fly';
  console.log('flight sim ready', BUILD);
  animate();
}

try {
  init();
} catch (err) {
  showError(err);
}
</script>
</body>
</html>
